[build]
  command = "cd netlify/functions && npm install && cd ../.. && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Proxy API requests to the Portfolio app's Netlify functions
[[redirects]]
  from = "/api/*"
  to = "https://niranjan-abathurai-portfolio.netlify.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Scheduled function for daily expiry notifications
# Runs at 18:31 UTC = 12:01 AM IST
[functions."expiry-notification"]
  schedule = "31 18 * * *"
