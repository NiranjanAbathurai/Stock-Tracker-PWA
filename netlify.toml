[build]
  command = "cd netlify/functions && npm install && cd ../.. && node scripts/bump-version.js && node scripts/generate-icons.js && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ─── Security Headers (all pages) ───
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; connect-src 'self' https://mskobghlcvvvlljfkbpr.supabase.co; font-src 'self' https://fonts.gstatic.com; frame-ancestors 'none'"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Android Digital Asset Links — must be served as JSON
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "no-cache"

# Serve .well-known files directly (needed for Android Digital Asset Links)
[[redirects]]
  from = "/.well-known/*"
  to = "/.well-known/:splat"
  status = 200

# SPA fallback — must come AFTER specific redirects

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Scheduled function for daily expiry notifications
# Runs every hour; the function checks each user's local timezone
# and only sends if it's midnight in their timezone.
[functions."expiry-notification"]
  schedule = "31 * * * *"

# Smart reminder notifications — runs every hour
# The function checks each user's local timezone and sends at:
#   Midday:  ~11:00 AM local time
#   Evening:  ~6:00 PM local time
[functions."smart-reminder"]
  schedule = "30 * * * *"

# Dish suggestion cron — runs every hour at :15
# Analyzes available inventory and suggests dishes users can cook.
# Processes at 7:00 AM and 5:00 PM in each user's local timezone.
[functions."dish-suggestions"]
  schedule = "15 * * * *"
