[build]
  command = "cd netlify/functions && npm install && cd ../.. && node scripts/bump-version.js && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Scheduled function for daily expiry notifications
# Runs at 18:31 UTC = 12:01 AM IST
[functions."expiry-notification"]
  schedule = "31 18 * * *"

  # Smart reminder notifications — three times daily
  # Morning:   2:30 UTC =  8:00 AM IST
  # Afternoon: 8:30 UTC =  2:00 PM IST
  # Evening:  13:30 UTC =  7:00 PM IST
[functions."smart-reminder"]
  schedule = "30 2,8,13 * * *"
