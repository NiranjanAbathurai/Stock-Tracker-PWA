<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1db954">
  <title>Stock Tracker — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin-bottom: 1.5rem;
      opacity: 0.8;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
      color: #1db954;
    }
    p {
      font-size: 1rem;
      color: #aaa;
      max-width: 320px;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .retry-btn {
      background: #1db954;
      color: #000;
      border: none;
      padding: 12px 32px;
      border-radius: 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .retry-btn:hover { opacity: 0.85; }
    .retry-btn:active { transform: scale(0.97); }
    .status {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #666;
    }
  </style>
</head>
<body>
  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#1db954" stroke-width="2">
    <line x1="1" y1="1" x2="23" y2="23"/>
    <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
    <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
    <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
    <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
    <line x1="12" y1="20" x2="12.01" y2="20"/>
  </svg>
  <h1>You're Offline</h1>
  <p>Stock Tracker needs an internet connection to sync your inventory. Your cached data is still available — just reconnect to make changes.</p>
  <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
  <div class="status">
    <span id="status-text">Waiting for connection...</span>
  </div>
  <script>
    window.addEventListener('online', () => {
      document.getElementById('status-text').textContent = 'Back online! Reloading...';
      setTimeout(() => window.location.reload(), 500);
    });
  </script>
</body>
</html>
